name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            ~/.gradle/caches
          key: android-sdk-${{ runner.os }}-${{ hashFiles('app/**/*.gradle.kts') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        working-directory: app
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign release APK with debug key
        working-directory: app
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,OU=Debug,O=Debug,L=Debug,ST=Debug,C=US"

          ZIPALIGN=$ANDROID_HOME/build-tools/34.0.0/zipalign
          APKSIGNER=$ANDROID_HOME/build-tools/34.0.0/apksigner

          mkdir -p dist
          $ZIPALIGN -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/app-release-aligned.apk
          $APKSIGNER sign \
            --ks $HOME/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out dist/VivoNoAds-release.apk \
            dist/app-release-aligned.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VivoNoAds-apk
          path: |
            app/dist/*.apk
            app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/VivoNoAds-release.apk
